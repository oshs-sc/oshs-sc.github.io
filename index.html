<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="천안오성고등학교 학생회">
    <title>천안오성고등학교 학생회</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #fff;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        main {
            padding: 24px;
            text-align: center;
        }

        h1 {
            margin: 12px 0 8px;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .school {
            margin: 0;
            font-size: 11px;
            letter-spacing: 0.2em;
            color: #888;
        }

        .subtitle {
            margin: 0;
            font-size: 13px;
            letter-spacing: 0.06em;
            color: #888;
        }

        .line {
            width: 32px;
            height: 1px;
            margin: 32px auto 0;
            background: #ddd;
        }
    </style>
</head>

<body>
    <main>
        <p class="school">OHSUNG HIGH SCHOOL</p>
        <h1>천안오성고등학교 학생회</h1>
        <p class="subtitle">Student Council</p>
        <div class="line" aria-hidden="true"></div>
    </main>
</body>

</html>
